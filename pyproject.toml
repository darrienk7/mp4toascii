[project]
name = "mp4-to-ascii"
version = "0.1.0"
description = "Convert MP4 videos into ASCII animations in the terminal"
requires-python = ">=3.11,<3.12"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "ffpyplayer",
    "questionary"
]

[project.scripts]
mp4-to-ascii = "mp4_to_ascii:main"